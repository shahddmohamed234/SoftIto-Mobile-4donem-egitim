<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFrame</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            background-color: khaki;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .card{
            background-color: blueviolet;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 52px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);

        }
        h3{
            margin-top: 0;
            color: #1e293b;
        }
        iframe{
            width: 100%;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>
<body>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/HD13eq_Pmp8?si=6JPK9zIL1q7xBCzA"
     title="YouTube video player" frameborder="0" allow="accelerometer;
      autoplay; clipboard-write; encrypted-media; gyroscope; 
      picture-in-picture;
     web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
     <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d25799.697106009316!2d28.98767195315255!3d41.1172781902183!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14cab5b58ba7eeff%3A0x31560b35ad4848d0!2sBeykent%20University!5e1!3m2!1sen!2str!4v1789995753352!5m2!1sen!2str" width="600" height="450" style="border:0;" 
     allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Uyumlu E-Ticaret Arayüzü</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="phone-container">
        <header class="top-menu">
            <button class="icon-btn">←</button>
            <div class="logo">Ürün Detayı</div>
            <button class="icon-btn">🛒</button>
        </header>

        <div class="image-container">
            <span class="badge badge-discount">20% İndirim</span>
            <span class="badge badge-shipping">Kargo Bedava</span>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQF_LWsZhBVFIzreMAj8BgugOA3rEQfEjhpGAAmhnjYw&s=10"
                alt="Dağcılık Ayakkabısı">


        </div>
        <div class="product-info">
            <h5>Simonds</h5>
            <h1 class="product-title">Kaya Tırmanışı Ayakkabısı</h1>
            <div class="predesc">Ürün Açıklaması</div>
            <p class="product-desc">Bu kaya tırmanışı ayakkabısı, her türlü arazide tırmanışı öğrenmek ve kendini
                geliştirmek isteyen tırmanıcılar için tasarlandı.</p>
            <div class="size-selection">
                <h3>Beden Seçin</h3>
                <div class="size-chips">
                    <div class="chip">39</div>
                    <div class="chip">40</div>
                    <div class="chip active">41</div>
                    <div class="chip">42</div>
                    <div class="chip">43</div>
                </div>
            </div>


        </div>
        <div class="bottom-bar">
            <div class="price-box">
                <span class="old-price">₺3.790</span>
                <span class="new-price">₺3.032</span>
            </div>
            <button class="cart-btn">Sepete Ekle</button>

        </div>

    </div>

</body>

</html>
